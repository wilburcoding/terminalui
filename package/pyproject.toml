[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miniui"
version = "0.1.2"
description = "A flexbox-inspired layout engine for building terminal UIs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Wilbur" }
]
keywords = ["tui", "terminal", "cli", "ui", "flexbox", "layout"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Terminals",
]
dependencies = [
    "pynput>=1.7",
]

[project.urls]
Homepage = "https://github.com/wilburcoding/terminalui"
Issues = "https://github.com/wilburcoding/terminalui/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/miniui"]